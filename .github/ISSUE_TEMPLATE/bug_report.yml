name: Bug report
description: Report a problem with the docs, workflows, scripts, or infrastructure templates in this repository
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please note this repository is a community starter kit, not an official Microsoft product.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Documentation (docs/)
        - GitHub Actions workflow (.github/workflows/)
        - PowerShell script (scripts/)
        - Bicep template (infrastructure/bicep/)
        - Terraform template (infrastructure/terraform/)
        - Sample solution (samples/)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
    validations:
      required: false
