name: Promote Copilot Solution

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target (configure required reviewers on production before enabling)
        required: true
        default: TEST
        type: choice
        options:
          - TEST
          - PROD
      export_run_id:
        description: Successful main-branch Export Copilot Solution from Dev run ID
        required: true
        type: string
      solution_name:
        description: Expected unique solution name in that export
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: solution-deployment-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    # This names the gate; required reviewers MUST be configured in GitHub settings.
    environment: ${{ inputs.target_environment == 'PROD' && 'production' || 'test' }}
    timeout-minutes: 90
    env:
      PP_ENVIRONMENT_URL: ${{ secrets.PP_ENVIRONMENT_URL }}
      PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
      PP_CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
      PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
      PP_AUTOMATION_ENABLED: ${{ vars.PP_AUTOMATION_ENABLED }}
      EXPORT_RUN_ID: ${{ inputs.export_run_id }}
      SOLUTION_NAME: ${{ inputs.solution_name }}
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Require environment setup and trusted export origin
        id: origin
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .\scripts\deployment-common.ps1
          Assert-AutomationEnvironment
          if ($env:TARGET_ENVIRONMENT -notin @('TEST', 'PROD')) { throw 'Invalid target.' }
          .\scripts\validate-export-run.ps1 -RunId $env:EXPORT_RUN_ID
      - uses: actions/download-artifact@v4
        with:
          name: solution-export
          path: out/promotion
          run-id: ${{ inputs.export_run_id }}
          github-token: ${{ github.token }}
      - name: Validate archive and reviewed target settings
        shell: pwsh
        env:
          EXPORT_COMMIT: ${{ steps.origin.outputs.commit }}
        run: |
          $settings = if ($env:TARGET_ENVIRONMENT -eq 'TEST') {
            'config\deployment-settings.test.json'
          } else {
            'config\deployment-settings.prod.json'
          }
          .\scripts\validate-deployment.ps1 -SolutionFile 'out\promotion\solution.zip' `
            -ManifestFile 'out\promotion\manifest.json' -ExpectedSolutionName $env:SOLUTION_NAME `
            -DeploymentSettingsFile $settings -ExpectedRunId $env:EXPORT_RUN_ID `
            -ExpectedRepository $env:GITHUB_REPOSITORY -ExpectedCommit $env:EXPORT_COMMIT
          "SETTINGS_FILE=$settings" >> $env:GITHUB_ENV
      - uses: microsoft/powerplatform-actions/actions-install@v1
      - name: Blocking solution checker (same environment as import)
        uses: microsoft/powerplatform-actions/check-solution@v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          path: out/promotion/solution.zip
          fail-on-analysis-error: true
          checker-logs-artifact-name: solution-checker
      - name: Read checker evidence
        uses: actions/download-artifact@v4
        with:
          name: solution-checker
          path: out/checker
      - name: Require zero findings and complete checker evidence
        shell: pwsh
        run: .\scripts\validate-checker-results.ps1 -ResultsFolder 'out\checker'
      - name: Import the original managed artifact
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_CLIENT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-file: out/promotion/solution.zip
          use-deployment-settings-file: true
          deployment-settings-file: ${{ env.SETTINGS_FILE }}
          force-overwrite: false
          publish-changes: false
          activate-plugins: false
      - name: Record promotion (agent publication is a separate operation)
        shell: pwsh
        run: |
          "Imported export run $env:EXPORT_RUN_ID into $env:TARGET_ENVIRONMENT." >> $env:GITHUB_STEP_SUMMARY
          "No agent publication or flow activation was performed. Follow docs/02-alm-and-automation.md." >> $env:GITHUB_STEP_SUMMARY
