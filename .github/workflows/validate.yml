name: Offline reliability checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax and fail-closed regression checks
        shell: pwsh
        run: .\scripts\test-reliability.ps1
