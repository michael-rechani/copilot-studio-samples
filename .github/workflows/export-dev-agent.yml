name: Export Copilot Solution from Dev

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: Unique name of a real solution in Dev (not a samples folder)
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: development
    timeout-minutes: 30
    env:
      PP_ENVIRONMENT_URL: ${{ secrets.PP_ENVIRONMENT_URL }}
      PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
      PP_CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
      PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
      PP_AUTOMATION_ENABLED: ${{ vars.PP_AUTOMATION_ENABLED }}
      SOLUTION_NAME: ${{ inputs.solution_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit environment setup
        shell: pwsh
        run: |
          . .\scripts\deployment-common.ps1
          Assert-AutomationEnvironment
      - uses: microsoft/powerplatform-actions/actions-install@v1
        with:
          add-tools-to-path: true
      - name: Export genuine managed and unmanaged archives
        shell: pwsh
        run: |
          .\scripts\export-agent.ps1 -EnvironmentUrl $env:PP_ENVIRONMENT_URL `
            -SolutionName $env:SOLUTION_NAME -TenantId $env:PP_TENANT_ID `
            -ClientId $env:PP_CLIENT_ID -ClientSecret $env:PP_CLIENT_SECRET
      - name: Preserve the export, not a repacked sample
        uses: actions/upload-artifact@v4
        with:
          name: solution-export
          path: out/export/
          if-no-files-found: error
          retention-days: 30
