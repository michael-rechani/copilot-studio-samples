kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - "speak with an agent"
      - "human support"
      - "talk to representative"
      - "escalate issue"

  actions:
    - kind: SendActivity
      id: sendActivity_escalate
      activity: "Connecting you with a support representative. Our team is available Mon-Fri 8am-8pm EST."

    - kind: Question
      id: question_email
      prompt: "Please provide your corporate email address so our team can follow up:"
      entity: StringPrebuiltEntity
      variable: init:Topic.UserEmail

    - kind: SendActivity
      id: sendActivity_confirmation
      activity: ="Thank you. A ticket has been dispatched to " & Topic.UserEmail & ". An engineer will reach out shortly."
