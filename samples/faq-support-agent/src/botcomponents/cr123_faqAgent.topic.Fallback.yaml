kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main

  actions:
    - kind: SearchAndSummarizeContent
      id: generative_answers
      userInput: =System.Activity.Text
      knowledgeSources:
        - kind: PublicWebsite
          url: "https://learn.microsoft.com/en-us/microsoft-copilot-studio/"
      variable: Topic.Answer

    - kind: ConditionGroup
      id: condition_has_answer
      conditions:
        - id: found_answer
          condition: =!IsBlank(Topic.Answer)
          actions:
            - kind: SendActivity
              id: send_answer
              activity: "{Topic.Answer}"
      elseActions:
        - kind: SendActivity
          id: send_fallback
          activity: "I'm sorry, I couldn't find an answer to your question in our knowledge base. Would you like to speak to human support?"
        - kind: BeginDialog
          id: route_to_escalate
          dialog: cr123_faqAgent.topic.Escalate
